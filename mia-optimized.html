<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Kleiner interaktiver Beziehungsantrag mit animierten Bildern">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffdceb">
  <meta name="theme-color" content="#ffdceb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2a0f1e" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta property="og:title" content="Willst du meine Freundin sein?">
  <meta property="og:description" content="Eine besondere Frage an eine besondere Person 💕">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pgxbkmrxms-commits.github.io/Mia-pages/mia-optimized.html">
  <meta property="og:image" content="https://pgxbkmrxms-commits.github.io/Mia-pages/images/giphy.gif">
  <meta property="og:image:width" content="250">
  <meta property="og:image:height" content="250">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Willst du meine Freundin sein?">
  <meta name="twitter:description" content="Eine besondere Frage an eine besondere Person 💕">
  <meta name="twitter:image" content="https://pgxbkmrxms-commits.github.io/Mia-pages/images/giphy.gif">
  <title>Willst du meine Freundin sein?</title>
  <link rel="stylesheet" href="assets/mia-optimized.css">
</head>
<body class="gradient-background">
  <div class="hearts" aria-hidden="true">
    <span class="heart heart-1"></span>
    <span class="heart heart-2"></span>
    <span class="heart heart-3"></span>
    <span class="heart heart-4"></span>
    <span class="heart heart-5"></span>
    <span class="heart heart-6"></span>
    <span class="heart heart-7"></span>
    <span class="heart heart-8"></span>
  </div>
  <main class="card" aria-labelledby="valentineQuestion" id="card">
    <div id="status" role="status" aria-live="polite" aria-atomic="true" class="visually-hidden"></div>
    <img id="imageDisplay" src="images/giphy.gif" alt="Niedliche animierte Grafik zum Valentinstag" width="250" height="250" loading="eager" decoding="async" fetchpriority="high" />
    <h1 id="valentineQuestion">Willst du meine Freundin sein?</h1>
    <p class="subtext" id="subtext">Ein kleines Ja macht meinen Tag perfekt.</p>
    <p class="hint" id="hint">Tipp: Mit Y/N/P geht's noch schneller. <span aria-hidden="true">Oder wische nach rechts/links!</span></p>
    <div class="buttons" id="responseButtons" role="group" aria-label="Antwortoptionen">
      <button id="yesButton" class="bounce" aria-label="Ja" type="button">Ja</button>
      <button id="maybeButton" aria-label="Vielleicht" type="button">Vielleicht</button>
      <button id="noButton" aria-label="Nein" type="button">Nein</button>
    </div>
    <div class="actions" id="afterActions" hidden>
      <button id="resetButton" type="button" aria-label="Von vorne beginnen">Nochmal 🔄</button>
    </div>
    <div class="secret-input-wrap">
      <label for="secretInput" class="visually-hidden">Geheimen Code eingeben</label>
      <input id="secretInput" class="secret-input" type="text" inputmode="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="geheimer code…" aria-label="Geheimen Code eingeben" />
    </div>
  </main>
  <div id="secretOverlay" class="secret-overlay" hidden aria-hidden="true">
    <div id="secretCard" class="secret-card" role="dialog" aria-modal="true" aria-labelledby="secretTitle" aria-describedby="secretText">
      <h2 id="secretTitle">Du hast das geheime Level gefunden 💖</h2>
      <p id="secretText">Du bist mein Lieblingsmensch. Für immer und jeden Tag ein bisschen mehr.</p>
      <button id="secretCloseButton" class="secret-close" type="button" aria-label="Geheime Nachricht schließen">Awww 🥰</button>
    </div>
  </div>
  <noscript>Bitte aktiviere JavaScript, damit die Interaktionen funktionieren.</noscript>

  <script type="module" src="assets/mia-optimized.js"></script>
</body>
</html>
